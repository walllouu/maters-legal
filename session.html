<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maters</title>
<style>
  body {
    background-color: #FBEDE3;
    margin: 0;
    height: 100vh;
  }
</style>
</head>
<body>
<script>
  var params = new URLSearchParams(window.location.search)
  var sessionId = params.get('id')
  if (sessionId) {
    window.location.href = 'maters://session/' + sessionId
    setTimeout(function() {
      window.location.href = 'https://apps.apple.com/fr/app/maters/id6768300932'
    }, 1500)
  } else {
    window.location.href = 'https://apps.apple.com/fr/app/maters/id6768300932'
  }
</script>
</body>
</html>
